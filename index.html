<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sortello - Your Daily Sorting Game</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #1E1A2B 0%, #100E17 100%);
      color: #FFFFFF;
      font-family: 'Outfit', sans-serif;
      text-align: center;
      padding: 24px;
    }
    .container {
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .logo {
      width: 88px;
      height: 88px;
      border-radius: 22px;
      box-shadow: 0 12px 32px rgba(158, 149, 255, 0.25);
      margin-bottom: 8px;
    }
    h1 {
      font-size: 38px;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #FFFFFF 30%, #F2C94C 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      font-size: 18px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.70);
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <main class="container">
    <img src="icon.png" alt="Sortello Logo" class="logo">
    <h1>Sortello</h1>
    <p>Your daily sorting game.</p>
  </main>
</body>
</html>
