<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sortello Challenge — ByteSolo Labs</title>
  <meta name="description" content="You've been challenged to solve a Sortello puzzle! Can you beat the target moves?">
  <meta name="theme-color" content="#141414">

  <!-- OpenGraph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Sortello">
  <meta property="og:title" content="Sortello Challenge Received 🏆">
  <meta property="og:description" content="Can you beat this score? Play the exact same puzzle on Sortello.">
  <meta property="og:url" content="https://sortello.bytesololabs.com/g">
  <meta property="og:image" content="https://sortello.bytesololabs.com/icon.png">

  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #141414;
      color: #FFFFFF;
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #1A1A1E;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 32px 24px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
    }
    .icon {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    h2 {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 6px;
    }
    p {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.55);
      margin-bottom: 24px;
      line-height: 1.4;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #61CE78;
      color: #0F1410;
      padding: 14px 28px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 15px;
      text-decoration: none;
      width: 100%;
      box-shadow: 0 6px 20px rgba(97, 206, 120, 0.25);
    }
    .spinner {
      margin-top: 16px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.35);
    }
  </style>
</head>
<body>

  <div class="card">
    <img src="../icon.png" alt="Sortello" class="icon">
    <h2>Sortello Challenge</h2>
    <p>Opening your shared puzzle in Sortello...</p>
    <a id="play-btn" href="../" class="btn">Play Challenge</a>
    <div class="spinner">Redirecting automatically...</div>
  </div>

  <script>
    (function() {
      var search = window.location.search;
      var hash = window.location.hash;
      var target = "../" + (search ? search : "") + (hash ? hash : "");
      
      var playBtn = document.getElementById('play-btn');
      if (playBtn) {
        playBtn.href = target;
      }

      // Automatic fast redirect
      setTimeout(function() {
        window.location.replace(target);
      }, 350);
    })();
  </script>

</body>
</html>
